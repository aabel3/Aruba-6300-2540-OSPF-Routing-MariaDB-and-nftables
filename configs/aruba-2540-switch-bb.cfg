!
! Aruba 2530/2540 (ArubaOS-Switch) configuration - Switch-BB
! LACP trunks and VLANs 11, 22, 33 and 44
!
! Based on the switch configuration file supplied with the project.
! Lines starting with "!" are comments; paste the rest into the switch CLI
! in configuration mode.
!
! This switch only carries the VLANs. Gateways and DHCP are on the 6300s.
!
hostname "Switch-BB"

! Trk1 -> Switch-AA (lag 1), Trk2 -> Switch-DD (Trk2)
trunk 2-3 trk1 lacp
trunk 4-5 trk2 lacp

vlan 11
exit
vlan 22
exit
vlan 33
exit
vlan 44
exit

int vlan 11
    tagged Trk1-Trk2
    exit
! Port 1 is the VLAN 22 VM
int vlan 22
    untagged 1
    tagged Trk1-Trk2
    exit
int vlan 33
    tagged Trk1-Trk2
    exit
int vlan 44
    tagged Trk1-Trk2
    exit
