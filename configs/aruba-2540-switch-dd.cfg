!
! Aruba 2530/2540 (ArubaOS-Switch) configuration - Switch-DD
! LACP trunks and VLANs 11, 22, 33 and 44
!
! Based on the switch configuration file supplied with the project.
! Lines starting with "!" are comments; paste the rest into the switch CLI
! in configuration mode.
!
! This switch only carries the VLANs. Gateways and DHCP are on the 6300s.
!
hostname "Switch-DD"

! Trk2 -> Switch-BB (Trk2), Trk3 -> Switch-CC (lag 2)
trunk 4-5 trk2 lacp
trunk 2-3 trk3 lacp

vlan 11
exit
vlan 22
exit
vlan 33
exit
vlan 44
exit

int vlan 11
    tagged Trk2-Trk3
    exit
int vlan 22
    tagged Trk2-Trk3
    exit
int vlan 33
    tagged Trk2-Trk3
    exit
! Port 1 is the VLAN 44 VM
int vlan 44
    untagged 1
    tagged Trk2-Trk3
    exit

spanning-tree mode rpvst
