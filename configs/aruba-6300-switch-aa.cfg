!
! Aruba 6300 (AOS-CX) configuration - Switch-AA
! OSPF routing, LACP trunk, VLANs 11 and 22, DHCP server
!
! Based on the switch configuration file supplied with the project,
! corrected to match the running configuration shown in the screenshots
! (DHCP pools for VLAN 33 and VLAN 44, pool name "vlan44").
! Lines starting with "!" are comments; paste the rest into the switch CLI
! in configuration mode.
!
! Not included: management interface, local user accounts and VSF settings.
!
hostname Switch-AA

vlan 11
exit
vlan 22
exit

spanning-tree mode rpvst

router ospf 1
    router-id 1.1.1.1
    area 0.0.0.0
exit

interface lag 1
    no shutdown
    no routing
    vlan trunk native 1
    vlan trunk allowed all
    lacp mode active
exit

! Routed point-to-point link to Switch-CC
interface 1/1/1
    no shutdown
    routing
    ip address 192.168.22.1/30
    ip ospf 1 area 0.0.0.0
exit

! LACP member ports towards Switch-BB
interface 1/1/2
    no shutdown
    lag 1
exit

interface 1/1/3
    no shutdown
    lag 1
exit

! Access port for the VLAN 11 VM
interface 1/1/4
    no shutdown
    no routing
    vlan access 11
exit

interface vlan 11
    ip address 172.16.11.1/27
    ip ospf 1 area 0.0.0.0
    no shutdown
exit

interface vlan 22
    ip address 172.16.22.1/27
    ip ospf 1 area 0.0.0.0
    no shutdown
exit

! DHCP server for all four VLANs. VLAN 33 and VLAN 44 requests arrive
! through the DHCP relay (ip helper-address) configured on Switch-CC.
dhcp-server vrf default
    pool vlan11
        range 172.16.11.10 172.16.11.30 prefix-len 27
        default-router 172.16.11.1
        exit
    pool vlan22
        range 172.16.22.10 172.16.22.30 prefix-len 27
        default-router 172.16.22.1
        exit
    pool vlan33
        range 172.16.33.10 172.16.33.30 prefix-len 27
        default-router 172.16.33.1
        exit
    pool vlan44
        range 172.16.44.10 172.16.44.30 prefix-len 27
        default-router 172.16.44.1
        exit
    enable
exit
