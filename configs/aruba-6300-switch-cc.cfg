!
! Aruba 6300 (AOS-CX) configuration - Switch-CC
! OSPF routing, LACP trunk, VLANs 33 and 44, DHCP relay
!
! Based on the switch configuration file supplied with the project
! (stray "n" before "hostname" removed). Lines starting with "!" are
! comments; paste the rest into the switch CLI in configuration mode.
!
hostname Switch-CC

spanning-tree mode rpvst

router ospf 1
    router-id 2.2.2.2
    area 0.0.0.0
exit

interface lag 2
    no shutdown
    no routing
    vlan trunk native 1
    vlan trunk allowed all
    lacp mode active
exit

! Routed point-to-point link to Switch-AA
interface 1/1/1
    no shutdown
    routing
    ip address 192.168.22.2/30
    ip ospf 1 area 0.0.0.0
exit

! LACP member ports towards Switch-DD
interface 1/1/2
    no shutdown
    lag 2
exit

interface 1/1/3
    no shutdown
    lag 2
exit

! Access port for the VLAN 33 VM
interface 1/1/4
    no shutdown
    no routing
    vlan access 33
exit

vlan 33
exit
vlan 44
exit

! Gateways with DHCP relay to the DHCP server on Switch-AA
interface vlan 33
    ip address 172.16.33.1/27
    ip helper-address 192.168.22.1
    ip ospf 1 area 0.0.0.0
exit

interface vlan 44
    ip address 172.16.44.1/27
    ip helper-address 192.168.22.1
    ip ospf 1 area 0.0.0.0
exit
