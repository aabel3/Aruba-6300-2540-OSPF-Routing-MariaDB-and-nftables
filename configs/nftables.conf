#!/usr/sbin/nft -f
#
# /etc/nftables.conf - host firewall used on all four Ubuntu VMs
#
# Default policy is drop for inbound and forwarded traffic. Only loopback,
# replies to existing connections, ICMP, SSH (22), HTTP (80), HTTPS (443)
# and MariaDB (3306) are allowed in. Outbound traffic is unrestricted.
#
# Apply:   sudo nft -f /etc/nftables.conf
# Clear:   sudo nft flush ruleset
# Persist: sudo systemctl enable --now nftables

flush ruleset

table inet filter {

    chain input {
        type filter hook input priority 0;

        policy drop;

        iif lo accept

        ct state established,related accept

        ip protocol icmp accept

        tcp dport 22 accept

        tcp dport 80 accept

        tcp dport 443 accept

        tcp dport 3306 accept
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }

}
